name: github
auth_type: api_key
allowed_hosts:
  - api.github.com
base_url: https://api.github.com
scope_actions:
  read: repositories:read
parameter_schema:
  type: object
  properties:
    owner: { type: string }
    repository: { type: string }
  required: [owner, repository]
scrub_patterns:
  - token
  - authorization
rate_limits:
  requests_per_minute: 60
