name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lanyard
          POSTGRES_USER: lanyard
          POSTGRES_PASSWORD: lanyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanyard -d lanyard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go test ./...
      - run: go build ./...
      - name: Apply database migration
        env:
          PGPASSWORD: lanyard
        run: psql -h localhost -U lanyard -d lanyard -v ON_ERROR_STOP=1 -f migrations/001_init.sql
      - name: Build container image
        run: docker build --tag lanyard:ci .
