name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lanyard
          POSTGRES_USER: lanyard
          POSTGRES_PASSWORD: lanyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanyard -d lanyard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Install Cedar CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cedar-policy/cedar/releases/download/cedar-policy-cli-v4.14.0/cedar-policy-cli-installer.sh | sh -s -- -y
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
      - name: Validate Cedar policies
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/usr/local/bin:$PATH"
          which cedar || true
          cedar validate --schema policies/schema.cedarschema.json --schema-format json --policies policies/default.cedar --policy-format cedar
      - name: Apply database migrations
        env:
          DATABASE_URL: postgres://lanyard:lanyard@localhost:5432/lanyard?sslmode=disable
        run: go run ./cmd/migrate
      - name: Configure integration-test role
        env:
          PGPASSWORD: lanyard
        run: psql -h localhost -U lanyard -d lanyard -v ON_ERROR_STOP=1 -c "ALTER ROLE lanyard_app PASSWORD 'lanyard_app'"
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://lanyard_app:lanyard_app@localhost:5432/lanyard?sslmode=disable
          TEST_ADMIN_DATABASE_URL: postgres://lanyard:lanyard@localhost:5432/lanyard?sslmode=disable
        run: go test ./...
      - run: go build ./...
      - name: Build container image
        run: docker build --tag lanyard:ci .
