services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lanyard
      POSTGRES_USER: lanyard
      POSTGRES_PASSWORD: lanyard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanyard -d lanyard"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/controlplane"]
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      TENANT_ID: tenant-demo
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/proxy"]
    environment:
      PORT: "8081"
      LOG_LEVEL: info
      TENANT_ID: tenant-demo
      ALLOW_INSECURE_DEMO: "true"
    depends_on:
      nats:
        condition: service_started
