# -------------------------------------------------
# NGINX config for the Ops console (Ops SSO)
# -------------------------------------------------
server {
    listen 80;
    server_name ops.linkedqueue.cloud;   # <-- change if you use a custom domain

    # -------------------------------------------------
    # Serve the static Next.js export (built in web/ops/out)
    # -------------------------------------------------
    root  /var/www/ops.out;          # <-- path where you copied web/ops/out
    index index.html;

    # Static Next.js runtime assets – serve directly (no proxy)
    location /ops/_next/  {
        try_files $uri $uri/ =404;
    }

    location /ops/static/ {
        try_files $uri $uri/ =404;
    }

    # -------------------------------------------------
    # Proxy **all remaining** /ops/* traffic to the Go API
    # -------------------------------------------------
    location /ops/ {
        proxy_pass http://127.0.0.1:8080;   # <-- control‑plane listening address
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------
    # Optional health‑check endpoint for the ALB / CI
    # -------------------------------------------------
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/ops/health;
    }
}
